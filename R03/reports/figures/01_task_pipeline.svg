   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(73.640391 321.716722)">공개 보드 사진</text>
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(71.422266 339.145785)">향후 D455 입력</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #2468ba" x="358.093125" y="209.869978" transform="rotate(-0 358.093125 209.869978)">① YOLO11n 검출</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(322.310469 242.4476)">보드 1종 bbox</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(306.16625 258.486116)">수정 micro + IoTKITs</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #2468ba" x="611.154844" y="209.460056" transform="rotate(-0 611.154844 209.460056)">보드 ROI</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(574.287656 242.5851)">관심 보드 영역</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(587.22125 258.486116)">좌표 보존</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #2468ba" x="843.618516" y="209.893416" transform="rotate(-0 843.618516 209.893416)">타일 분할</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(794.142578 241.767834)">1024 px / 20% 겹침</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(801.251328 258.486116)">원본 좌표로 복원</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #008875" x="1087.8525" y="203.027098" transform="rotate(-0 1087.8525 203.027098)">③·④ 부품 검출</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(1036.305469 239.018639)">YOLO11n / YOLO11s</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(1035.266484 255.825436)">저항·콘덴서·IC·커넥터</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(1042.896016 271.820983)">출력: 부품별 bbox</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #db8b22" x="358.093125" y="411.389728" transform="rotate(-0 358.093125 411.389728)">② YOLO11n-seg</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(301.611563 443.34485)">IoTKITs native polygon</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(308.292344 460.688756)">보드 전체 외곽 학습</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #db8b22" x="708.259922" y="412.045978" transform="rotate(-0 708.259922 412.045978)">출력: 보드 영역 mask</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(634.525547 444.712116)">보드 경계를 픽셀 단위로 표시</text>
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; fill: #1d2d44" transform="translate(614.227969 460.734303)">부품별 mask는 이 모델의 출력이 아님</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #516478" transform="translate(949.810313 406.410609)">공통 후처리</text>
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #516478" transform="translate(941.700938 419.219203)">원본 좌표 결합</text>
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #516478" transform="translate(919.482188 432.027797)">타일 간 중복 검출 정리</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #b34453" x="617.04" y="552.672" transform="rotate(-0 617.04 552.672)">보드 mask 학습과 부품 mask 학습은 다릅니다. 이번 신규 4종 부품 모델은 bbox 검출입니다.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #516478" x="617.04" y="583.776" transform="rotate(-0 617.04 583.776)">R02의 IC·전해콘덴서·커넥터 semantic-CC 모델은 별도 보조 실험이며, 신규 4종 부품 mask 모델로 취급하지 않습니다.</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #1d2d44" x="27.36" y="34.345312" transform="rotate(-0 27.36 34.345312)">보드와 부품을 나누어 학습하는 구조</text>
  </g>
  <g id="text_19">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #516478" x="27.36" y="58.699425" transform="rotate(-0 27.36 58.699425)">현재 모델의 역할과 추론 연결 설계 · D455 실제 촬영 성능과 통합 실측은 별도 검증 대상</text>
  </g>
 </g>
