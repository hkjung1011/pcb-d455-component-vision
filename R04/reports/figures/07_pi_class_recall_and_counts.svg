  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; fill: #485462" transform="translate(24.572617 439.766719)">막대 위 숫자는 TP / 원본 GT 수다. 원본 정답의 미실장 footprint·unknown 문제를 임의로 재라벨링하거나 제외하지 않았다. Pi 앞뒤 2장·1그룹이므로 그룹 신뢰구간이나 일반적인</text>
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; fill: #485462" transform="translate(24.572617 449.624531)">Raspberry Pi 성능으로 해석하지 않는다. R03에서 이미 검토한 개발 holdout 재사용 · 새로운 최종 시험 아님 · 실제 D455 미검증</text>
  </g>
